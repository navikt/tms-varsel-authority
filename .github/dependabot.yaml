version: 2

registries:
  nav-maven:
    type: maven-repository
    url: https://github-package-registry-mirror.gc.nav.no/cached/maven-release

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      time: "08:00"
      timezone: "Europe/Oslo"
    groups:
      github:
        patterns:
          - "*"
    cooldown:
      default-days: 3
    labels:
      - github-actions
      - tms-backend

  - package-ecosystem: "gradle"
    directory: "/"
    registries:
      - nav-maven
    schedule:
      interval: "weekly"
      time: "08:00"
      timezone: "Europe/Oslo"
    groups:
      central-admin:
        patterns:
          - "no.nav.tms:*"
      gradle-major:
        patterns:
          - "*"
        update-types:
          - "major"
    labels:
      - gradle-dependency
      - tms-backend
