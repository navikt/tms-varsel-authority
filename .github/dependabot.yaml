version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      time: "08:00"
      timezone: "Europe/Oslo"
    groups:
      gradle-wrapper:
        patterns:
          - "gradle-wrapper"
        exclude-patterns:
          - "no.nav.tms.*"
      dependency-updates:
        patterns:
          - "*"
        exclude-patterns:
          - "gradle-wrapper"
          - "no.nav.tms.*"
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "daily"
      time: "08:00"
      timezone: "Europe/Oslo"
    groups:
      min-side-libraries:
        patterns:
          - "no.nav.tms.common:*"
          - "no.nav.tms.kafka:*"
          - "no.nav.tms.token.support:*"
