version: 2

registries:
  nav-maven:
    type: maven-repository
    url: https://github-package-registry-mirror.gc.nav.no/cached/maven-release

updates:
  - package-ecosystem: "gradle"
    directory: "/"
    registries:
      - nav-maven
    schedule:
      interval: "weekly"
      time: "08:00"
      timezone: "Europe/Oslo"
    groups:
      gradle-wrapper:
        patterns:
          - "gradle-wrapper"
        exclude-patterns:
          - "no.nav.tms.*"
      dependency-updates:
        patterns:
          - "*"
        exclude-patterns:
          - "gradle-wrapper"
          - "no.nav.tms.*"
      min-side-libraries:
        patterns:
          - "no.nav.tms.common:*"
          - "no.nav.tms.kafka:*"
          - "no.nav.tms.token.support:*"
